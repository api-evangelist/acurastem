aid: acurastem
name: AcuraStem
description: 'AcuraStem, Inc. is a privately held, patient-based biotechnology company
  headquartered in Monrovia, California, developing therapeutics for neurodegenerative
  diseases including sporadic ALS (amyotrophic lateral sclerosis) and frontotemporal
  dementia (FTD). The company''s proprietary iNeuroRx drug-discovery platform builds
  disease models from induced pluripotent stem cells (iPSC) taken from individual patients,
  in place of animal models, and pairs them with machine-learning analysis to identify
  and validate targets. Its lead antisense oligonucleotide candidate, AS-241 (PIKFYVE),
  is advancing toward first-in-human testing with California Institute for Regenerative
  Medicine (CIRM) grant support. AcuraStem is a therapeutics developer rather than a
  software vendor: it publishes no public API, developer portal, SDK, or machine-readable
  contract of any kind. This profile records that absence with the probe evidence behind
  it.'
